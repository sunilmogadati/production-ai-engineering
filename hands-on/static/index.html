<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prospect Scoring - hot / warm / cold</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --panel2: #273449;
      --text: #e2e8f0; --muted: #94a3b8; --line: #334155;
      --hot: #ef4444; --warm: #f59e0b; --cold: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
    header h1 { margin: 0 0 4px; font-size: 26px; }
    header p { margin: 0; color: var(--muted); }
    .card-model {
      display: flex; flex-wrap: wrap; gap: 20px; margin: 18px 0 26px;
      padding: 14px 18px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; align-items: center;
    }
    .card-model .kv { font-size: 14px; }
    .card-model .kv b { display: block; font-size: 18px; }
    .card-model .kv span { color: var(--muted); }
    .controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    button, input, select {
      font: inherit; color: var(--text); background: var(--panel2);
      border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--muted); }
    button.primary { background: #2563eb; border-color: #2563eb; }

    .columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .col { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    .col h2 { margin: 4px 6px 12px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
    .col h2 .count {
      margin-left: auto; font-size: 13px; color: var(--muted);
      background: var(--panel2); padding: 2px 9px; border-radius: 999px;
    }
    .col.hot { border-top: 3px solid var(--hot); }
    .col.warm { border-top: 3px solid var(--warm); }
    .col.cold { border-top: 3px solid var(--cold); }

    .lead {
      background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 12px; margin-bottom: 10px;
    }
    .lead .top { display: flex; justify-content: space-between; align-items: baseline; }
    .lead .id { font-weight: 600; }
    .lead .prob { font-size: 20px; font-weight: 700; }
    .hot .prob { color: var(--hot); } .warm .prob { color: var(--warm); } .cold .prob { color: var(--cold); }
    .bar { height: 6px; background: #0b1220; border-radius: 999px; margin: 8px 0; overflow: hidden; }
    .bar > i { display: block; height: 100%; }
    .hot .bar > i { background: var(--hot); } .warm .bar > i { background: var(--warm); } .cold .bar > i { background: var(--cold); }
    .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 10px; }
    .meta b { color: var(--text); font-weight: 600; }

    .scorer { margin: 26px 0; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    .scorer h3 { margin: 0 0 12px; }
    .scorer .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
    .scorer label { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); gap: 4px; }
    .scorer .result { margin-top: 14px; font-size: 15px; }
    .pill { padding: 3px 10px; border-radius: 999px; font-weight: 700; text-transform: uppercase; font-size: 12px; }
    .pill.hot { background: rgba(239,68,68,.15); color: var(--hot); }
    .pill.warm { background: rgba(245,158,11,.15); color: var(--warm); }
    .pill.cold { background: rgba(56,189,248,.15); color: var(--cold); }
    .err { color: #fca5a5; }
    @media (max-width: 820px) { .columns { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const API = "";
    const ORDER = { hot: 0, warm: 1, cold: 2 };
    const LABEL = { hot: "🔥 Hot", warm: "🌤 Warm", cold: "🧊 Cold" };
    const pct = (p) => (p * 100).toFixed(0) + "%";

    function LeadCard({ p, onClick }) {
      return (
        <div className={"lead " + p.temperature} onClick={() => onClick(p)} style={{ cursor: 'pointer' }}>
          <div className="top">
            <span className="id">{p.customer_id}</span>
            <span className="prob">{pct(p.probability)}</span>
          </div>
          <div className="bar"><i style={{ width: pct(p.probability) }} /></div>
          <div className="meta">
            <span>intent <b>{p.intent_signal}</b></span>
            <span>budget <b>${p.budget}</b></span>
            <span>ad <b>{p.ad_source}</b></span>
            <span>prior <b>{p.prior_purchases}</b></span>
          </div>
        </div>
      );
    }

    function LeadDetailModal({ lead, onClose }) {
      if (!lead) return null;

      // Mock data generator: in production, this comes from CRM/call history API
      const id_hash = lead.customer_id.charCodeAt(5) || 0;
      const phone = `+1-${415 + (id_hash % 50)}-${500 + (id_hash * 7) % 500}-${1000 + (id_hash * 3) % 9000}`;

      const callHistories = [
        "Initial discovery call: Discussed pain points around lead qualification. Prospect interested in demo.",
        "Follow-up call: Reviewed product roadmap. Asked about integrations with Salesforce. Timeline: Q3 purchase decision.",
        "Executive briefing: CFO joined call. Discussed ROI and pricing tiers. Budget approved for pilot program.",
        "Requirements gathering: IT team on call. Discussed security, compliance, and on-prem vs. cloud options.",
        "No prior contact: New lead from referral. Warm introduction. High intent signal.",
      ];
      const callSummary = callHistories[id_hash % callHistories.length];

      // Extract some context from lead data and mock some common objections/solutions
      const painPoints = ["manual admin work", "lead loss", "process inefficiency", "team productivity", "reporting overhead"];
      const solutions = ["automation", "AI-powered workflow", "integrated dashboard", "real-time insights"];
      const topics = ["lead qualification", "sales pipeline automation", "team productivity", "process optimization"];

      const prospectName = `Contact at ${lead.customer_id}`;
      const painPoint = painPoints[id_hash % painPoints.length];
      const solution = solutions[id_hash % solutions.length];
      const topic = topics[id_hash % topics.length];

      const scripts = [
        `Hi ${prospectName}, thanks for taking my call. I know you're busy, so I'll be quick. I wanted to circle back on the solution we discussed around ${topic}. Have you had a chance to chat with your team? What's your timeline looking like?`,
        `${prospectName}, this is [YOUR NAME] from [YOUR COMPANY]. I noticed you've been considering solutions in this space. I'd love to share a quick 15-minute overview of how we've helped companies like yours reduce ${painPoint}. Would next Tuesday or Wednesday work?`,
        `${prospectName}, I wanted to follow up on our last conversation about ${topic}. One of our clients in your industry actually solved that exact problem with a ${solution} approach. Might be worth a 20-minute chat. Free next week?`,
        `Hey ${prospectName}, we had talked about ${topic} as a priority for your team. I've got a couple new capabilities we shipped that directly address ${painPoint}. Think it's worth reconvening with your team?`,
      ];
      const script = scripts[id_hash % scripts.length];

      return (
        <div style={{
          position: 'fixed', top: 0, left: 0, right: 0, bottom: 0,
          background: 'rgba(0,0,0,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center',
          zIndex: 1000
        }} onClick={onClose}>
          <div style={{
            background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: '12px',
            padding: '24px', maxWidth: '500px', width: '90%', maxHeight: '85vh', overflow: 'auto',
            color: 'var(--text)', fontFamily: 'system-ui'
          }} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '20px' }}>
              <h2 style={{ margin: 0, fontSize: '20px' }}>{lead.customer_id}</h2>
              <button onClick={onClose} style={{
                background: 'transparent', border: 'none', color: 'var(--muted)',
                fontSize: '24px', cursor: 'pointer', padding: 0
              }}>×</button>
            </div>

            <div style={{ marginBottom: '18px', paddingBottom: '12px', borderBottom: '1px solid var(--line)' }}>
              <p style={{ margin: '4px 0', color: 'var(--muted)', fontSize: '13px' }}>PROBABILITY</p>
              <span style={{ fontSize: '24px', fontWeight: 'bold', color: lead.temperature === 'hot' ? 'var(--hot)' : lead.temperature === 'warm' ? 'var(--warm)' : 'var(--cold)' }}>
                {pct(lead.probability)}
              </span>
              <p style={{ margin: '4px 0', fontSize: '12px', color: 'var(--muted)' }}>
                Intent {lead.intent_signal} • Budget ${lead.budget} • {lead.ad_source} • {lead.prior_purchases} prior
              </p>
            </div>

            <div style={{ marginBottom: '18px', paddingBottom: '12px', borderBottom: '1px solid var(--line)' }}>
              <p style={{ margin: '4px 0 8px 0', color: 'var(--muted)', fontSize: '13px', fontWeight: '600' }}>📞 PHONE NUMBER</p>
              <p style={{ margin: 0, fontSize: '16px', fontFamily: 'monospace', fontWeight: '600' }}>{phone}</p>
              <button onClick={() => navigator.clipboard.writeText(phone)} style={{
                background: 'var(--panel2)', border: '1px solid var(--line)', color: 'var(--text)',
                borderRadius: '6px', padding: '4px 12px', fontSize: '12px', marginTop: '8px', cursor: 'pointer'
              }}>Copy</button>
            </div>

            <div style={{ marginBottom: '18px', paddingBottom: '12px', borderBottom: '1px solid var(--line)' }}>
              <p style={{ margin: '4px 0 8px 0', color: 'var(--muted)', fontSize: '13px', fontWeight: '600' }}>📋 CALL HISTORY SUMMARY</p>
              <p style={{ margin: 0, fontSize: '14px', lineHeight: '1.5', color: 'var(--text)' }}>
                {callSummary}
              </p>
            </div>

            <div>
              <p style={{ margin: '4px 0 8px 0', color: 'var(--muted)', fontSize: '13px', fontWeight: '600' }}>💬 SUGGESTED CALLBACK SCRIPT</p>
              <div style={{
                background: 'var(--panel2)', border: '1px solid var(--line)', borderRadius: '8px',
                padding: '12px', fontSize: '13px', lineHeight: '1.6', color: 'var(--text)',
                fontFamily: 'system-ui', whiteSpace: 'pre-wrap', wordWrap: 'break-word'
              }}>
                {script}
              </div>
              <p style={{ margin: '8px 0 0 0', fontSize: '11px', color: 'var(--muted)' }}>
                ✏️ Personalize with prospect name, pain point, and company before dialing.
              </p>
            </div>
          </div>
        </div>
      );
    }

    function Column({ temp, leads, onLeadClick }) {
      return (
        <div className={"col " + temp}>
          <h2>{LABEL[temp]} <span className="count">{leads.length}</span></h2>
          {leads.map((p) => <LeadCard key={p.customer_id} p={p} onClick={onLeadClick} />)}
        </div>
      );
    }

    function Scorer({ onScored }) {
      const [form, setForm] = useState({ intent_signal: 80, budget: 120, ad_source: "tv", prior_purchases: 1 });
      const [result, setResult] = useState(null);
      const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

      async function submit() {
        const body = {
          customer_id: "WHAT-IF",
          intent_signal: Number(form.intent_signal),
          budget: Number(form.budget),
          ad_source: form.ad_source,
          prior_purchases: Number(form.prior_purchases),
        };
        const r = await fetch(API + "/api/score", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
        });
        const data = await r.json();
        setResult(data);
        onScored && onScored();
      }

      return (
        <div className="scorer">
          <h3>What-if: score a single prospect</h3>
          <div className="row">
            <label>Intent (0-100)
              <input type="number" min="0" max="100" value={form.intent_signal} onChange={set("intent_signal")} />
            </label>
            <label>Budget ($)
              <input type="number" min="1" value={form.budget} onChange={set("budget")} />
            </label>
            <label>Ad source
              <select value={form.ad_source} onChange={set("ad_source")}>
                <option value="tv">tv</option><option value="social">social</option><option value="email">email</option>
              </select>
            </label>
            <label>Prior purchases
              <input type="number" min="0" value={form.prior_purchases} onChange={set("prior_purchases")} />
            </label>
            <button className="primary" onClick={submit}>Score</button>
          </div>
          {result && (
            <div className="result">
              Model says <span className={"pill " + result.temperature}>{result.temperature}</span>{" "}
              &nbsp;conversion probability <b>{pct(result.probability)}</b>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [meta, setMeta] = useState(null);
      const [prospects, setProspects] = useState([]);
      const [limit, setLimit] = useState(120);
      const [error, setError] = useState(null);
      const [selectedLead, setSelectedLead] = useState(null);

      async function load() {
        try {
          const [m, p] = await Promise.all([
            fetch(API + "/api/meta").then((r) => r.json()),
            fetch(API + "/api/prospects?limit=" + limit).then((r) => r.json()),
          ]);
          setMeta(m); setProspects(p); setError(null);
        } catch (e) { setError(String(e)); }
      }
      useEffect(() => { load(); }, [limit]);

      const byTemp = { hot: [], warm: [], cold: [] };
      prospects.forEach((p) => byTemp[p.temperature].push(p));

      return (
        <div className="wrap">
          <header>
            <h1>Prospect Scoring Board</h1>
            <p>Every lead scored by the saved model, bucketed hot / warm / cold. Click any prospect to see phone number, call history, and suggested script.</p>
          </header>

          {meta && (
            <div className="card-model">
              <div className="kv"><b>{meta.model_type}</b><span>model v{meta.model_version}</span></div>
              <div className="kv"><b>{(meta.test_accuracy * 100).toFixed(1)}%</b><span>held-out test accuracy</span></div>
              <div className="kv"><b>{meta.training_rows}</b><span>training rows</span></div>
              <div className="kv"><b>{prospects.length}</b><span>prospects scored</span></div>
              <div className="controls">
                <label style={{ color: "var(--muted)", fontSize: 13 }}>show
                  <select value={limit} onChange={(e) => setLimit(Number(e.target.value))} style={{ marginLeft: 6 }}>
                    <option value={60}>60</option><option value={120}>120</option><option value={300}>300</option>
                  </select>
                </label>
                <button onClick={load}>Refresh</button>
              </div>
            </div>
          )}

          {error && <p className="err">Could not reach the API: {error}</p>}

          <Scorer onScored={load} />

          <div className="columns">
            {["hot", "warm", "cold"].sort((a, b) => ORDER[a] - ORDER[b]).map((t) => (
              <Column key={t} temp={t} leads={byTemp[t]} onLeadClick={setSelectedLead} />
            ))}
          </div>

          <LeadDetailModal lead={selectedLead} onClose={() => setSelectedLead(null)} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
